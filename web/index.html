<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minecraft map</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <canvas id="map" tabindex="0" aria-label="Minecraft map. Drag to pan; scroll to zoom."></canvas>
  <nav class="zoom" aria-label="Zoom">
    <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
  </nav>
  <select id="map-select" aria-label="Map" disabled><option>Loading maps…</option></select>
  <nav id="rotation-controls" aria-label="Rotation"></nav>
  <nav id="coordinates" aria-label="Coordinates">
    <button id="coordinate-x" type="button" title="Copy X coordinate">X: —</button>
    <button id="coordinate-z" type="button" title="Copy Z coordinate">Z: —</button>
    <button id="coordinate-region" type="button" title="Copy region filename">—</button>
  </nav>
  <output id="copy-feedback" hidden></output>
  <div id="message" role="status">
    <strong id="message-title">Loading map…</strong>
    <p id="message-detail"></p>
    <button id="retry" type="button" hidden>Retry</button>
  </div>
</body>
</html>
